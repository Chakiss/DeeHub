name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod]
        default: prod

concurrency:
  # Never let two deploys race: the second would shift traffic to an image whose
  # migration had not run.
  group: deploy-prod
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  ENVIRONMENT: prod

jobs:
  # Deploying an untested commit is how a bad booking path reaches production.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      # Workload Identity Federation: GitHub mints a short-lived token per run,
      # so there is no long-lived service-account key to leak or rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tags
        id: images
        run: |
          REGISTRY="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/deehub-${ENVIRONMENT}"
          # Tag by commit SHA, never :latest — a rollback has to be able to name
          # the exact image that was running.
          echo "api=${REGISTRY}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # --provenance/--sbom off: either one makes BuildKit publish an OCI index
      # instead of a plain manifest, which writes the tag twice. Artifact
      # Registry has immutable tags, so the second write fails with "cannot
      # update tag" once the image has already been uploaded.
      - name: Build and push API image
        run: |
          docker build --provenance=false --sbom=false \
            -f apps/api/Dockerfile -t "${{ steps.images.outputs.api }}" .
          docker push "${{ steps.images.outputs.api }}"

      - name: Build and push dashboard image
        run: |
          docker build --provenance=false --sbom=false \
            -f apps/admin-web/Dockerfile -t "${{ steps.images.outputs.web }}" .
          docker push "${{ steps.images.outputs.web }}"

      # Migrations run BEFORE any traffic shifts. Expand/contract means the old
      # code keeps working against the new schema (docs/database.md §12); if this
      # step fails the deploy stops here and production is untouched.
      - name: Run database migrations
        run: |
          gcloud run jobs update "deehub-migrate-${ENVIRONMENT}" \
            --region "${REGION}" \
            --image "${{ steps.images.outputs.api }}" \
            --quiet
          gcloud run jobs execute "deehub-migrate-${ENVIRONMENT}" \
            --region "${REGION}" \
            --wait

      - name: Deploy API
        run: |
          gcloud run deploy "deehub-api-${ENVIRONMENT}" \
            --region "${REGION}" \
            --image "${{ steps.images.outputs.api }}" \
            --quiet

      # Only when the worker actually exists. It is not deployed unless channel
      # sync is on (see enable_channel_sync), and `gcloud run deploy` CREATES a
      # missing service rather than failing — which would quietly stand up a
      # worker with no VPC access, no secrets and no service account, crash
      # looping while billing for an always-on instance.
      - name: Deploy worker
        run: |
          if gcloud run services describe "deehub-worker-${ENVIRONMENT}" \
               --region "${REGION}" >/dev/null 2>&1; then
            gcloud run deploy "deehub-worker-${ENVIRONMENT}" \
              --region "${REGION}" \
              --image "${{ steps.images.outputs.api }}" \
              --command node --args dist/worker.js \
              --quiet
          else
            echo "No worker service — channel sync is disabled. Skipping."
          fi

      # The maintenance job runs hourly and is the only thing draining the
      # outbox and reconciling inventory on a deployment without a worker.
      # Leaving it on an old image means that safety net silently runs stale
      # code after every deploy.
      - name: Update maintenance job
        run: |
          gcloud run jobs update "deehub-maintenance-${ENVIRONMENT}" \
            --region "${REGION}" \
            --image "${{ steps.images.outputs.api }}" \
            --quiet

      - name: Deploy dashboard
        run: |
          gcloud run deploy "deehub-web-${ENVIRONMENT}" \
            --region "${REGION}" \
            --image "${{ steps.images.outputs.web }}" \
            --quiet

      # The marketing site is static files in a bucket behind the load
      # balancer, not a container, so it ships by sync rather than by deploy.
      #
      # Skipped when the bucket does not exist: it is created by Terraform only
      # when custom_domain is set, and a missing bucket must not fail a release
      # of the actual product.
      #
      # `-d` deletes objects that are no longer in the repository — without it a
      # page renamed today stays reachable at its old address forever. The two
      # cache headers differ on purpose: HTML must be re-fetched or a deploy is
      # invisible, while fingerprinted assets, fonts and images can sit in the
      # CDN. Order matters — the broad rule runs first and HTML corrects itself
      # afterwards.
      - name: Deploy marketing site
        run: |
          BUCKET="deehub-marketing-${ENVIRONMENT}-${{ secrets.GCP_PROJECT_ID }}"
          # Skip ONLY when the bucket genuinely does not exist. A describe that
          # fails for any other reason — a 403, most likely — must fail the
          # step: the first version of this guard read "cannot see it" as
          # "does not exist" and silently shipped a release with no site.
          if ! DESCRIBE_ERR=$(gcloud storage buckets describe "gs://${BUCKET}" 2>&1 >/dev/null); then
            if echo "$DESCRIBE_ERR" | grep -qiE "not found|404"; then
              echo "No marketing bucket — custom_domain is unset. Skipping."
              exit 0
            fi
            echo "Marketing bucket could not be read — refusing to skip silently:"
            echo "$DESCRIBE_ERR"
            exit 1
          fi
          gcloud storage rsync apps/marketing "gs://${BUCKET}" \
            --recursive --delete-unmatched-destination-objects \
            --cache-control="public, max-age=3600"
          gcloud storage cp apps/marketing/index.html "gs://${BUCKET}/index.html" \
            --cache-control="public, max-age=300"
          gcloud storage cp apps/marketing/en/index.html "gs://${BUCKET}/en/index.html" \
            --cache-control="public, max-age=300"

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe "deehub-api-${ENVIRONMENT}" \
            --region "${REGION}" --format 'value(status.url)')
          WEB_URL=$(gcloud run services describe "deehub-web-${ENVIRONMENT}" \
            --region "${REGION}" --format 'value(status.url)')

          # Readiness, not liveness: this must prove the new revision can
          # actually reach the database before we call the deploy good.
          curl -fsS --retry 5 --retry-delay 3 "${API_URL}/health/ready"
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null "${WEB_URL}/login"
          echo "Deployed ${GITHUB_SHA} — API ${API_URL}, dashboard ${WEB_URL}"

      - name: Report rollback command on failure
        if: failure()
        run: |
          echo "::error::Deploy failed. Roll back with:"
          echo "gcloud run services update-traffic deehub-api-${ENVIRONMENT} \
            --region ${REGION} --to-revisions PREVIOUS_REVISION=100"
