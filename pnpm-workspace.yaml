packages:
  - apps/*
  - packages/*

# Explicit build-script allowlist. Anything not listed here cannot run
# postinstall scripts — a supply-chain attack surface we opt into deliberately.
allowBuilds:
  # esbuild links its platform binary during install; vitest and drizzle-kit need it.
  esbuild: true
  # Analytics telemetry. No functional purpose for us.
  '@scarf/scarf': false
  # Optional native accelerator for BullMQ's job serialization. Declined: it
  # would put build tooling back in the Docker image for a throughput gain we
  # do not need at this scale, and msgpackr falls back to pure JS.
  msgpackr-extract: false
  # Next.js compiles with SWC; without this the dashboard cannot build.
  '@swc/core': true
  # Native file watching for `next dev`. Dev-only, no production surface.
  '@parcel/watcher': true
  # Image optimization. Declined until we actually serve room photos — it adds a
  # native binary to the runtime image for a feature nothing uses yet.
  sharp: false
